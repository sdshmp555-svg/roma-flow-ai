ROMA_WEB_BASE64
          base64 --decode /tmp/roma_web_restore/web.b64 > /tmp/roma_web_restore/web.tgz
          rm -rf web
          tar -xzf /tmp/roma_web_restore/web.tgz
          test -f web/index.html
          test -f web/runtime-config.js

      - name: Inject API base URL
        script: |
          python3 - <<'PYINJECT'
          from pathlib import Path
          import os
          p = Path("web/runtime-config.js")
          url = os.environ.get("API_BASE_URL", "")
          if url == "demo":
              url = ""
          p.write_text("window.ROMA_FLOW_API_BASE = " + repr(url) + ";\n")
          PYINJECT

      - name: Create Android project
        script: npx cap add android

      - name: Sync Capacitor web assets
        script: npx cap sync android

      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build installable debug APK
        script: cd android && ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
