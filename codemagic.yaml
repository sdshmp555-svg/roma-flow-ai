workflows:
  android-debug-apk:
    name: ROMA FLOW AI Android Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22.16.0
      vars:
        API_BASE_URL: "demo"
    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Inject API base URL
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("web/runtime-config.js")
          url = os.environ.get("API_BASE_URL", "")
          if url == "demo":
              url = ""
          p.write_text("window.ROMA_FLOW_API_BASE = " + repr(url) + ";\n")
          PY

      - name: Create Android project
        script: npx cap add android

      - name: Sync Capacitor web assets
        script: npx cap sync android

      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build installable debug APK
        script: cd android && ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
