workflows:
  android-debug-apk:
    name: ROMA FLOW AI Android Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22.16.0
      vars:
        API_BASE_URL: "demo"
    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Restore web assets
        script: |
          python3 - <<'PY'
          import base64
          import io
          import zipfile
          from pathlib import Path

          DATA = ''
          out = Path("web")
          if out.exists():
              import shutil
              shutil.rmtree(out)
          out.mkdir(parents=True)
          raw = base64.b64decode(DATA)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              z.extractall(out)
          print("Restored web assets:", [p.as_posix() for p in out.rglob("*") if p.is_file()])
          PY

      - name: Set demo API configuration
        script: |
          python3 - <<'PY'
          from pathlib import Path
          Path("web/runtime-config.js").write_text(
              "// Generated for offline demo mode.\n"
              "window.ROMA_FLOW_API_BASE = '';\n",
              encoding="utf-8"
          )
          PY

      - name: Verify web assets
        script: |
          test -f web/index.html
          test -f web/runtime-config.js
          test -f web/manifest.webmanifest
          test -f web/static/icons/icon-192.png
          echo "Web assets verified."

      - name: Create Android project
        script: npx cap add android

      - name: Sync Capacitor web assets
        script: npx cap sync android

      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build installable debug APK
        script: cd android && ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
